# Bite Score — Netlify settings. Nothing to change here.
[build]
  publish = "public"
  command = "node scripts/build-lakes.mjs"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["public/engine.js"]

# The service worker must never be cached, so updates reach phones quickly.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# The widget is meant to be shown inside other websites.
[[headers]]
  for = "/embed.html"
  [headers.values]
    Content-Security-Policy = "frame-ancestors *"
